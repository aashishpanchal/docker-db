# Basic Settings
bind 0.0.0.0
protected-mode yes
port 6379

# Memory Management
maxmemory 2gb
maxmemory-policy allkeys-lru

# Persistence
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Security (disable dangerous commands)
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG "CONFIG_b835729b9b5c4e9a8b7c6d2f1e3a4b5c"

# Timeout (optional)
timeout 300
tcp-keepalive 300
